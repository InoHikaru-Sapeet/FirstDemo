name: CI

on:
  pull_request: {}
  push:
    branches: [main]

# 同一 PR/ブランチの古い実行はキャンセルして minutes を節約
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lock-check:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Check lockfile is up to date
        run: uv lock --check

  lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: make sync
      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # DB は SQLite（既定）。postgres サービスは不要。
    # PostgreSQL へ戻す場合は services: postgresql と DB_BACKEND=postgresql を復活させる。
    env:
      DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: make sync
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Test
        run: make test-ci
