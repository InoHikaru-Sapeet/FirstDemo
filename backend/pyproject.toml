[project]
name = "ai-intelligence-apps"
version = "0.1.0"
description = "ai-intelligence-apps backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    # 手元の既定 DB は SQLite（Docker 不要）。asyncpg は将来の PostgreSQL 移行用に残す。
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "anthropic>=0.116",
    "openpyxl>=3.1",
    # パスワードハッシュ（TASKS.md §1.1「認証」／T-08）。自前でハッシュ処理を書かない。
    "passlib[bcrypt]>=1.7.4",
    # ⚠️ bcrypt の上限 <5 を外さないこと。passlib 1.7.4 は bcrypt バックエンドの
    # 初期化時に 72 バイト超の probe を渡して挙動を検査するが、bcrypt 5.0.0 は
    # これを黙って切り詰めず ValueError にするため、
    # **CryptContext.hash() が必ず失敗する**（T-08 で 5.0.0 / 4.3.0 を実測）。
    # 上げる場合は、まず実際に hash/verify が通るかを確認すること。
    "bcrypt>=4.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "ty>=0.0.1a1",
    "alembic>=1.14",
]

[tool.ruff]
src = ["src"]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["adapter", "application", "common", "config", "enterprise"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/__init__.py", "src/run_local.py"]
